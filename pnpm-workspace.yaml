packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for shared tool versions.
# Packages reference these with "catalog:" instead of a version number.
catalog:
  typescript: ^5.9.3
  eslint: ^9.39.5
  "@eslint/js": ^9
  typescript-eslint: ^8.71.0
  "@types/node": ^22
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  zod: ^4.6.5
  pino: ^10.4.0
  pino-pretty: ^13.1.3
  vitest: ^5.0.3

allowBuilds:
  unrs-resolver: true
  esbuild: true
  "@prisma/engines": true
  prisma: true

minimumReleaseAgeExclude:
  - pino@10.4.0
